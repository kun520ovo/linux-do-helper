name: Build and release userscript

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: userscript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      filename: ${{ steps.metadata.outputs.filename }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Read userscript version
        id: metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";

          const header = await readFile("src/userscript-header.txt", "utf8");
          const version = header.match(/^\/\/ @version\s+(\d+\.\d+\.\d+)\s*$/m)?.[1];
          if (!version) throw new Error("Expected an x.y.z version in src/userscript-header.txt");
          await appendFile(
            process.env.GITHUB_OUTPUT,
            `version=${version}\nfilename=linux.do助手${version}.js\n`,
          );
          NODE

      - name: Build userscript
        shell: bash
        env:
          OUTPUT_FILE: ${{ steps.metadata.outputs.filename }}
        run: |
          npx --yes esbuild@0.28.2 src/entry.js \
            --bundle \
            --format=iife \
            --target=es2022 \
            --charset=utf8 \
            --loader:.css=text \
            --legal-comments=inline \
            --outfile="$OUTPUT_FILE"

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const outputPath = process.env.OUTPUT_FILE;
          const header = await readFile("src/userscript-header.txt", "utf8");
          const code = await readFile(outputPath, "utf8");
          // Keep the installable script free of generated source-path markers.
          const userscript =
            header.trimEnd() + "\n" + code.replace(/^[\t ]*\/\/ src\/[^\r\n]*(?:\r?\n|$)/gm, "");
          await writeFile(outputPath, userscript, "utf8");
          await writeFile("linux-do-helper.user.js", userscript, "utf8");
          NODE

          node --check "$OUTPUT_FILE"

      - name: Upload userscript
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-do-assistant
          path: |
            ${{ steps.metadata.outputs.filename }}
            linux-do-helper.user.js
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download userscript
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --name linux-do-assistant --dir dist

      - name: Publish userscript assets
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SCRIPT_FILE: ${{ needs.build.outputs.filename }}
        run: |
          tag="v$VERSION"
          versioned_file="dist/$SCRIPT_FILE"
          install_file="dist/linux-do-helper.user.js"
          test -s "$versioned_file"
          test -s "$install_file"
          cmp "$versioned_file" "$install_file"
          # GitHub normalizes non-ASCII asset names; use the same name on retries.
          release_filename="linux.do.$VERSION.js"
          release_file="dist/$release_filename"
          cp "$versioned_file" "$release_file"

          notes_file="$RUNNER_TEMP/userscript-release-notes.md"
          cat > "$notes_file" <<EOF
          由 GitHub Actions 从提交 [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) 自动构建。

          下载 linux-do-helper.user.js 安装到 ScriptCat 或 Tampermonkey；$release_filename 是相同内容的版本文件。

          [查看构建记录](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$release_file" "$install_file" --clobber
          else
            gh release create "$tag" "$release_file" "$install_file" \
              --target "$GITHUB_SHA" \
              --title "linux.do 助手 $VERSION" \
              --notes-file "$notes_file" \
              --draft
          fi
          gh release edit "$tag" --draft=false --latest --notes-file "$notes_file"
          release_url="$(gh release view "$tag" --json url --jq .url)"
          printf 'Published [%s](%s) with the installable userscript.\n' "$tag" "$release_url" >> "$GITHUB_STEP_SUMMARY"
